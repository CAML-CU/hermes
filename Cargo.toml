[workspace]
members = ["crates/hermes-core", "crates/hermes-python"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
async-nats = "0.39"
futures-util = "0.3"
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"
pyo3 = "0.22"
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
uuid = "1"
